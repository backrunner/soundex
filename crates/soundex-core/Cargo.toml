[package]
name = "soundex-core"
description = "Core library for SoundEx real-time audio enhancement via lightweight AI model"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
soundex-dsp.workspace = true
ort = { workspace = true, optional = true }
ndarray.workspace = true
thiserror.workspace = true
log.workspace = true
rtrb = "0.3"
# JSON policy/report exchange for the standalone parity validation utility.
serde_json.workspace = true
# Float64 inverse FFT in the standalone parity utility; already a DSP dependency.
rustfft.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Safe, thread-local USER_INITIATED QoS; no scheduler FFI in the audio adapter.
qos-threads = "0.1.3"
# Audio time-constraint scheduling, safe API; macOS only, no D-Bus/global limits.
audio_thread_priority = { version = "0.38", default-features = false }

[dev-dependencies]
criterion.workspace = true
approx.workspace = true
serde.workspace = true
sha2.workspace = true
libc.workspace = true
# WAV output for self-contained demos; already used by the CLI.
hound.workspace = true

[features]
default = ["ort-backend"]
ort-backend = ["ort"]
embedded-model = []

[[example]]
name = "offline_demo"
required-features = ["ort-backend"]

[[example]]
name = "realtime_demo"
required-features = ["ort-backend"]

[[bench]]
name = "core_bench"
harness = false

[[bench]]
name = "realtime_bench"
harness = false

[[bench]]
name = "extension_bench"
harness = false

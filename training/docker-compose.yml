# SoundEx training stack
#
# Usage:
#   # Build
#   docker compose build
#
#   # Download MUSDB (mix-only prune) + preprocess + train
#   DATA_HOST=/path/on/host DOWNLOAD_DATASETS=musdb18-hq docker compose run --rm train
#
#   # Full auto (huge): MUSDB + Slakh mix-only
#   DATA_HOST=/path/on/host DOWNLOAD_DATASETS=musdb18-hq,slakh2100 docker compose run --rm train
#
#   # Data prep only (no train)
#   DATA_HOST=/path/on/host DOWNLOAD_DATASETS=musdb18-hq RUN_TRAIN=0 docker compose run --rm train
#
#   # Env check only
#   docker compose run --rm train-check

services:
  train:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Override for CUDA 13 hosts: pytorch/pytorch:2.12.1-cuda13.0-cudnn9-runtime
        BASE_IMAGE: pytorch/pytorch:2.12.1-cuda12.6-cudnn9-runtime
    image: soundex-train:latest
    gpus: all
    volumes:
      - ${DATA_HOST:-./data_host}:/data
    environment:
      DATA_ROOT: ${DATA_ROOT:-/data}
      CACHE_DIR: ${CACHE_DIR:-}
      DOWNLOAD_CACHE_DIR: ${DOWNLOAD_CACHE_DIR:-}
      MUSDB18_HQ_PATH: ${MUSDB18_HQ_PATH:-}
      SLAKH2100_PATH: ${SLAKH2100_PATH:-}
      MEDLEYDB_PATH: ${MEDLEYDB_PATH:-}
      BABYSLAKH_PATH: ${BABYSLAKH_PATH:-}
      PATHS_MANIFEST: ${PATHS_MANIFEST:-}
      DOWNLOAD_DATASETS: ${DOWNLOAD_DATASETS:-}
      SKIP_EXISTING: ${SKIP_EXISTING:-1}
      PREPROCESS: ${PREPROCESS:-}
      KEEP_ARCHIVE: ${KEEP_ARCHIVE:-0}
      RUN_TRAIN: ${RUN_TRAIN:-1}
      CONFIG: ${CONFIG:-configs/default.yaml}
      MEDLEYDB_URL: ${MEDLEYDB_URL:-}
      EXTRA_TRAIN_ARGS: ${EXTRA_TRAIN_ARGS:-}
    # shm for DataLoader workers
    shm_size: "8gb"

  train-check:
    image: soundex-train:latest
    build:
      context: .
      dockerfile: Dockerfile
    gpus: all
    environment:
      CHECK_ENV_ONLY: "1"
    entrypoint: ["/workspace/scripts/entrypoint.sh"]

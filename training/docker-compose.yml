# SoundEx training stack
#
# Usage:
#   # Build
#   docker compose build
#
#   # Train with already prepared pairs matching the selected config
#   DATA_HOST=/path/on/host MUSIC_LIBRARY_PATH=/data/music-library docker compose run --rm train
#
#   # Env check only
#   docker compose run --rm train-check

services:
  train:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Override for CUDA 13 hosts: pytorch/pytorch:2.12.1-cuda13.0-cudnn9-runtime
        BASE_IMAGE: pytorch/pytorch:2.12.1-cuda12.6-cudnn9-runtime
    image: soundex-train:latest
    gpus: all
    volumes:
      - ${DATA_HOST:-./data_host}:/data
    environment:
      DATA_ROOT: ${DATA_ROOT:-/data}
      MUSIC_LIBRARY_PATH: ${MUSIC_LIBRARY_PATH:-}
      SPEECH_LIBRARY_PATH: ${SPEECH_LIBRARY_PATH:-}
      PATHS_MANIFEST: ${PATHS_MANIFEST:-}
      RUN_TRAIN: ${RUN_TRAIN:-1}
      CONFIG: ${CONFIG:-configs/default.yaml}
      # Forward retired options only so old automation fails with migration guidance.
      DOWNLOAD_DATASETS: ${DOWNLOAD_DATASETS:-}
      PREPROCESS: ${PREPROCESS:-0}
      EXTRA_TRAIN_ARGS: ${EXTRA_TRAIN_ARGS:-}
    # shm for DataLoader workers
    shm_size: "8gb"

  train-check:
    image: soundex-train:latest
    build:
      context: .
      dockerfile: Dockerfile
    gpus: all
    environment:
      CHECK_ENV_ONLY: "1"
    entrypoint: ["/workspace/scripts/entrypoint.sh"]
